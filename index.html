<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRL Pulse — Live Test Availability</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060B1C; --bg-base: #0A1224; --bg-elev: #101A35;
            --teal: #3DD9D6; --available: #39FF7F; --unavailable: #FF4D6D;
            --text: #E8F1FF; --text-muted: #8898B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg-base); color: var(--text); 
            font-family: 'IBM Plex Sans', sans-serif;
            background-image: radial-gradient(circle at top, rgba(61, 217, 214, 0.05), transparent);
            min-height: 100vh; padding-bottom: 50px;
        }
        header { 
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; background: rgba(10, 18, 36, 0.8);
        }
        .logo { height: 50px; }
        .hero { padding: 60px 40px; max-width: 1200px; margin: 0 auto; text-align: center; }
        h1 { font-size: 48px; margin-bottom: 15px; }
        .status-bar { 
            background: var(--bg-elev); padding: 15px 30px; border-radius: 50px;
            display: inline-flex; gap: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1); margin-top: 20px;
        }
        .search-container { max-width: 800px; margin: 0 auto 40px; padding: 0 20px; }
        #search { 
            width: 100%; padding: 20px 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-elev); color: white; font-size: 18px; outline: none; transition: 0.3s;
        }
        #search:focus { border-color: var(--teal); box-shadow: 0 0 15px rgba(61, 217, 214, 0.2); }
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px;
        }
        .card { 
            background: var(--bg-elev); padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(61, 217, 214, 0.3); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; top: 25px; right: 25px; }
        .Available { background: var(--available); box-shadow: 0 0 10px var(--available); }
        .Unavailable { background: var(--unavailable); }
        .dept-tag { 
            font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--teal);
            margin-bottom: 8px; display: block;
        }
        .test-name { font-size: 18px; font-weight: 700; margin-bottom: 15px; padding-right: 20px; }
        .meta { font-size: 13px; color: var(--text-muted); display: grid; gap: 8px; }
        .meta-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 5px; }
    </style>
</head>
<body>
    <header>
        <img src="assets/logos/cluster.png" alt="Cluster" class="logo">
        <div style="text-align:center"><b style="font-size:20px; display:block">MRL Pulse</b><small style="color:var(--text-muted); font-size:10px">REGIONAL LABORATORY MADINAH</small></div>
        <img src="assets/logos/mrl.png" alt="MRL" class="logo">
    </header>

    <div class="hero">
        <h1>Real-time <span style="color:var(--teal)">Availability.</span></h1>
        <div class="status-bar">
            <span>TOTAL TESTS: <b id="total-val">0</b></span>
            <span>AVAILABLE: <b id="avail-val" style="color:var(--available)">0</b></span>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search by test name or department...">
    </div>

    <div class="grid" id="test-grid"></div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2RJ4WkKRdv-0yoDWyQwa_9ic8L2v4JNh7EQ43djTBYCRAicBFopn7xnxCgdObvFwc6_hPLhpNlEGc/pub?gid=1222333647&single=true&output=csv";

        async function loadTests() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                const tests = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        name: cols[0]?.replace(/"/g, '').trim(),
                        dept: cols[1]?.replace(/"/g, '').trim(),
                        sample: cols[2]?.replace(/"/g, '').trim(),
                        tube: cols[3]?.replace(/"/g, '').trim(),
                        tat: cols[4]?.replace(/"/g, '').trim(),
                        status: cols[5]?.trim().replace(/"/g, '') || 'Unavailable'
                    };
                }).filter(t => t.name);
                displayTests(tests);
                document.getElementById('search').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = tests.filter(t => t.name.toLowerCase().includes(term) || t.dept.toLowerCase().includes(term));
                    displayTests(filtered);
                });
            } catch (error) {
                console.error(error);
            }
        }

        function displayTests(tests) {
            const grid = document.getElementById('test-grid');
            grid.innerHTML = '';
            let availCount = 0;
            tests.forEach(t => {
                if(t.status === 'Available') availCount++;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="status-dot ${t.status}"></div><span class="dept-tag">${t.dept}</span><div class="test-name">${t.name}</div><div class="meta"><div class="meta-item"><span>Sample:</span> <span>${t.sample}</span></div><div class="meta-item"><span>Tube:</span> <span>${t.tube}</span></div><div class="meta-item"><span>TAT:</span> <span>${t.tat}</span></div></div>`;
                grid.appendChild(card);
            });
            document.getElementById('total-val').innerText = tests.length;
            document.getElementById('avail-val').innerText = availCount;
        }
        loadTests();
    </script>
</body>
</html>
